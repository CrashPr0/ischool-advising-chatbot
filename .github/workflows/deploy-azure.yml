name: Deploy to Azure App Service

on:
  push:
    branches: [main]
    # Documentation-only pushes do not change the running app or the advising
    # corpus (text and PDF under data/advising_docs). Skip the full deploy so
    # those commits do not spend the shared Actions minutes. A push that also
    # changes application code still deploys. Use the workflow_dispatch button
    # when a docs-only change must be published anyway.
    paths-ignore:
      - "docs/**"
      - "deliverables/**"
      - "**/*.md"
      - "**/*.markdown"
  workflow_dispatch:

# Serialize production publishes. A second push waits until the in-progress
# deploy finishes, so two runs cannot upload different commits or rebuild the
# index at the same time. In-progress work is not cancelled: abandoning a zip
# deploy halfway can leave App Service on a partial release.
concurrency:
  group: azure-app-service-production
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    env:
      APP_URL: https://ischooladvisingchatbot-dx4ynl.azurewebsites.net
      DOCS_LOAD_TOKEN: ${{ secrets.DOCS_LOAD_TOKEN }}

    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run tests
        run: python -m pytest tests/ -q

      # Deploy the exact commit that passed CI. Building an explicit archive
      # prevents OneDeploy from retaining backend modules from an older release.
      - name: Create deployment package
        run: |
          git archive --format=zip --output=deploy-package.zip HEAD
          printf '%s\n' "$GITHUB_SHA" > deployment_version.txt
          zip --quiet deploy-package.zip deployment_version.txt
          unzip -p deploy-package.zip src/knowledge_base.py | grep -q "_phrase_matches"

      # Azure must run Oryx (pip install) on the server: App Service setting
      # SCM_DO_BUILD_DURING_DEPLOYMENT=true. If it is false, gunicorn fails with
      # "No module named 'flask_cors'" because nothing installs requirements.txt.

      - name: Deploy to Azure Web App
        uses: azure/webapps-deploy@v3
        with:
          app-name: ischooladvisingchatbot-dx4ynl
          publish-profile: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE }}
          package: deploy-package.zip

      - name: Wait for the deployed app
        run: |
          for attempt in {1..60}; do
            if curl --fail --silent --show-error --max-time 15 \
              "$APP_URL/healthz" --output health.json; then
              deployed_version="$(jq --raw-output '.version // ""' health.json)"
              if [ "$deployed_version" = "$GITHUB_SHA" ]; then
                exit 0
              fi
              echo "Azure is still serving release $deployed_version ($attempt/60)"
            fi
            sleep 10
          done
          echo "Azure did not begin serving release $GITHUB_SHA in time" >&2
          exit 1

      # Source snapshots are committed, but the derived Chroma database is
      # intentionally not. Rebuild it on Azure, then require the receipt written
      # by that rebuild to name this commit. A previous collection left on
      # persistent storage is not proof.
      - name: Rebuild production advising index
        run: python scripts/verify_deployed_index.py

      - name: Verify production advising index
        run: python scripts/verify_deployed_index.py --verify-only
