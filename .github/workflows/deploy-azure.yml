name: Deploy to Azure App Service

on:
  push:
    branches: [main]

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    env:
      APP_URL: https://ischooladvisingchatbot-dx4ynl.azurewebsites.net
      DOCS_LOAD_TOKEN: ${{ secrets.DOCS_LOAD_TOKEN }}

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run tests
        run: python -m pytest tests/ -q

      # Deploy the exact commit that passed CI. Building an explicit archive
      # prevents OneDeploy from retaining backend modules from an older release.
      - name: Create deployment package
        run: |
          git archive --format=zip --output=deploy-package.zip HEAD
          unzip -p deploy-package.zip src/knowledge_base.py | grep -q "_phrase_matches"

      # Azure must run Oryx (pip install) on the server: App Service setting
      # SCM_DO_BUILD_DURING_DEPLOYMENT=true. If it is false, gunicorn fails with
      # "No module named 'flask_cors'" because nothing installs requirements.txt.

      - name: Deploy to Azure Web App
        uses: azure/webapps-deploy@v3
        with:
          app-name: ischooladvisingchatbot-dx4ynl
          publish-profile: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE }}
          package: deploy-package.zip

      - name: Wait for the deployed app
        run: |
          for attempt in {1..30}; do
            if curl --fail --silent --show-error --max-time 15 "$APP_URL/healthz"; then
              exit 0
            fi
            sleep 10
          done
          echo "Azure app did not become healthy in time" >&2
          exit 1

      # Source snapshots are committed, but the derived Chroma database is
      # intentionally not. Rebuild it on Azure with the same embedding provider
      # used at query time, then prove the deployed collection is non-empty.
      - name: Rebuild production advising index
        run: |
          test -n "$DOCS_LOAD_TOKEN" || {
            echo "Repository secret DOCS_LOAD_TOKEN is required" >&2
            exit 1
          }
          # The smallest App Service tier can briefly starve the HTTP worker
          # while local embeddings are being computed. A timeout here does not
          # mean the accepted background job stopped, so continue to polling.
          curl --fail --silent --show-error \
            --max-time 30 \
            --request POST \
            --header "X-Admin-Token: $DOCS_LOAD_TOKEN" \
            "$APP_URL/api/load-docs?async=true" \
            --output docs-job.json || {
              result=$?
              if [ "$result" -ne 28 ]; then
                exit "$result"
              fi
              echo "Rebuild request is still running; waiting for status"
            }
          for attempt in {1..80}; do
            if ! curl --fail --silent --show-error \
              --max-time 30 \
              --header "X-Admin-Token: $DOCS_LOAD_TOKEN" \
              "$APP_URL/api/load-docs/status" \
              --output docs-job.json; then
              echo "Index worker is busy; retrying status ($attempt/80)"
              sleep 15
              continue
            fi
            status="$(jq --raw-output '.status' docs-job.json)"
            case "$status" in
              succeeded) exit 0 ;;
              failed)
                cat docs-job.json
                exit 1
                ;;
              queued|running) sleep 15 ;;
              *)
                cat docs-job.json
                exit 1
                ;;
            esac
          done
          echo "Document index rebuild did not complete in time" >&2
          exit 1

      - name: Verify production advising index
        run: |
          curl --fail --silent --show-error \
            --max-time 60 \
            --header "X-Admin-Token: $DOCS_LOAD_TOKEN" \
            "$APP_URL/api/docs-stats" \
            --output docs-stats.json
          python - <<'PY'
          import json

          with open("docs-stats.json", encoding="utf-8") as handle:
              stats = json.load(handle)
          chunk_count = stats.get("vector_store_chunks") or 0
          source_count = stats.get("scan", {}).get("total_files") or 0
          print(f"Azure advising corpus: {source_count} source files, {chunk_count} chunks")
          if source_count < 1 or chunk_count < 1:
              raise SystemExit("Azure advising index is empty")
          PY
