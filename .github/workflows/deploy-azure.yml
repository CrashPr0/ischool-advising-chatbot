name: Deploy to Azure App Service

on:
  push:
    branches: [main]

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run tests
        run: python -m pytest tests/ -q

      # Deploy the exact commit that passed CI. Building an explicit archive
      # prevents OneDeploy from retaining backend modules from an older release.
      - name: Create deployment package
        run: |
          git archive --format=zip --output=deploy-package.zip HEAD
          unzip -p deploy-package.zip src/knowledge_base.py | grep -q "_phrase_matches"

      # Azure must run Oryx (pip install) on the server: App Service setting
      # SCM_DO_BUILD_DURING_DEPLOYMENT=true. If it is false, gunicorn fails with
      # "No module named 'flask_cors'" because nothing installs requirements.txt.

      - name: Deploy to Azure Web App
        uses: azure/webapps-deploy@v3
        with:
          app-name: ischooladvisingchatbot-dx4ynl
          publish-profile: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE }}
          package: deploy-package.zip
