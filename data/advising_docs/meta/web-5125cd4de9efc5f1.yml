atomic_section: Fall Graduation Deadlines
retrieval_header: 'For an MLIS graduate student graduating in Fall 2026 (December), GAPE lists September 1, 2026 as the graduation application deadline for first-time applicants and April 1, 2026 as the candidacy form submission deadline to GAPE.'
