atomic_section: Important Dates and Deadlines
retrieval_header: 'For a BS ISDA undergraduate graduating in Fall 2026, the final graduation application deadline is the Fall 2026 add deadline: September 15, 2026. The Registrar calendar lists Tue, Sep. 15 as the Last Day to Add/Drop Classes via MySJSU (ends at 11:59 pm).'
