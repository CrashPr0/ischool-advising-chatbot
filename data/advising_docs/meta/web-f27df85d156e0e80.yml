atomic_section: Due Dates for Submission to iSchool
retrieval_header: 'MLIS candidacy timing for December graduation: submit the candidacy form to the iSchool by March 25. The iSchool deadline is earlier than GAPE''s because the iSchool reviews, signs, and forwards the form to GAPE.'
