atomic_section: Application Deadlines
retrieval_header: 'How to apply to graduate, and when an SJSU undergraduate should
  apply for graduation, including the Information Science and Data Analytics (ISDA)
  major. You must apply for graduation no later than the add deadline of the term
  in which you wish to graduate. If you apply by the dates shown below, you will
  receive priority registration. Deadline 1 allows two semesters with priority registration.
  Deadline 2 allows one semester with priority registration.'
